# ---- Main setings  ----
ObservatoryName=Petofi 9 monitoring   # Name of the Observatory
SystemName=Petofi9Mon     # Instrument/computer name (this information is saved to compressed files)

ClockFormat=%YYYY.%MM.%DD %hh:%mm:%ss
UseUTCtime=false
newline=CRLF

@linux:windowpos=8,4		# Top-left corner of window
@linux:windowsize=-8,-70	# Size of window, x/y or "max", or "0x0" for auto, or "-x,-y" to set distance from right/bottom 

# ---- General configuration settings (defined by $xxx  macros) ----
$mains_frequency=50
$palmacq=no	# Use internal PalmAcq with GPS (obligatory)

# --- Instrument selection: $adam/$obsdaq/$didd/$lawson/$ppm ---
# Only one $ppm can exist, and can be connected to one or more three-comp system

$ICP7033=NO
$obsdaq=NO # Use obsDAq fast A/D converter
$camera_proc=NO
$mqtt_line=true

# ---- Auxiliary instruments/samplers/GPS-settings ----
$palmacq_gps=YES	   # Use GPS of PalmAcq
@!$palmacq:$palmacq_gps=no
$direct_gps=no      # Use GPS with serial or USB cable
$gpsacq=NO	 # Plot (and optionally save) GPS data
$sysmon=YES 	# Display and save some system monitoring data (for example: CPU temp)
$sysmon_ext=NO # Some extended system monitoring data

# File saving
saveinterval=20   # Interval for saving data and log files, in minutes
$save_rawgps_data=NO  # Save raw GPS data
$save_10mingps_data=NO  # Save 10 minute GPS averages

# Debugging parameters
$drectime=NO  # Calculate and show record's time interval
$tsa_monitoring=NO	# Monitoring/debug of time stamp adjustment calculation
$deltavalue=no
$averagelog=log:0  # ues "log:xxx" to get the first "xxx" average's calculate log file in semicolon-separated .csv format
debuglevel=0
$lawson_deb=no # Debug for Lawson Labs M250 A/D acquisition
$fs_stress_test=no  # File system stress test and performance monitoring

# Special settings:
enableplot=yes   # no:disable plot drawing for very slow computers
@win:
  mainthread_cycle_ms=20  # in msec. For windows: can be 2 for fast sampling
  comthread_cycle_us=500  # in usec. For Windows: at least 500
@else
  mainthread_cycle_ms=250  # in msec. For windows: for Linux 100-300 is recommended:
  comthread_cycle_us=1500  # in usec. 
  watchdog=/tmp/maglin-wd.fifo
@end
dres_saveinterval=360
DataRestoreDir=dres
enable_deletekey=YES


# ------------------------------------------------
# ---  Magnetomter acquisition configurations ----
# ------------------------------------------------

# ----------------- Save Directories and Log ------------------------------

[savedir]
id=datadir
dir=./data
diskspacelimit=40mb
filenumberlimit=3000
nodeletedays=3

[savedir]
id=sumdir
dir=./data/sum
diskspacelimit=40mb
filenumberlimit=3000
nodeletedays=3

[palmacq]
UsePalmAcq=$palmacq
@$palmacq_port?:
  comport=${palmacq_port},57600
@else
  @win: comport=COM7,57600
  @linux:comport=/dev/palmacq0,57600
@end  
# set_baud=57600 # ToCheck
UseDTR=FALSE
UseRTS=FALSE    # ToCheck
ReadCycleDelay=0
firmware_version=420  # ToCheck
TickFreq=1000  # ToCheck

[log]
LogLinesCount=120
MaxLogPerHour=118  # maximum log lines per hour (to avoid long log list in case of continous problems)
save=datadir,%YYYY-%MM.LOG,ascii,_  # ,schedule:test

# ---------- Camera processing measurement ----------------
[Sampler] 
use=$camera_proc
id=Camera proc
shortname=CamProc
triggermode=rxstream
comport=/dev/pts/5,9600
samplingmode=Text
# datatransfer=
timeout_interval=10.0
sampling_interval=1
comps=cam_HMV,cam_Futes,cam_Lang,cam_Szelep
msgformat=%lf %lf %lf %lf
maxmsglength=250
datatransfer=TempMon_Raw

# ---------- ICP7033 Pt-100 measurement ----------------

[Sampler] 
use=$ICP7033
id=ICP7033
shortname=ICP-7033
triggermode=pcclock
comport=/dev/ttyUSB0,9600
samplingmode=ADAM
moduletype=7033
moduleaddr=03
hex_format=FALSE
mains_frequency=$mains_frequency  # 50/60 Hz rejection
inputrange_code=20
datatransfer=TempMon_Raw(Temp1:T_boiler_out,Temp2:T_DHW_back,Temp3:${Temp3_compname})
timeout_interval=0.5
sampling_interval=1
comps=Temp1,Temp2,Temp3
channels=0,1,2
sim=no
nan_strings=+9999.9

[DataStore] 
use=$ICP7033
id=TempMon_Raw
shortname=Temp. data raw
desc=Raw temperature data
records=64000 
emptydata_interval=0.99    # in seconds, data whole 
averaging=no  
#compn=Name,Unit,precisity,Min,Max[,YAxisStep=1,mult:m,const:c] 
comp=T_boiler_out,°C,3,-40,100,mult:1
comp=T_DHW_back,°C,3,-40,100,mult:1
comp=${Temp3_compname},°C,3,-40,100,mult:1
comp=T_DHW_diff,°C,3,-40,+100,calc:T_boiler_out-T_DHW_back
@$camera_proc:
  comp=cam_HMV,_,1,   38.8,90.0,  mult:1,plotheight:0.8
  comp=cam_Futes,_,1, 68,  120.0, mult:1,plotheight:0.8
  comp=cam_Lang,,_,1, 0,   90,    mult:1,plotheight:0.8
  comp=cam_Szelep,_,1,0,   255,   mult:1,plotheight:0.8
@end
# comp=TTank_diff,°C,3,-60,60,CALC:TTank_in-TTank_out

@$drectime: 
  comp=dRecTime,msec,3,-1000,1500,1,1,0,mult:1000,drectime,plotheight:0.4  # ,nosave 
  # comp=avgDRecTime,Hz,4,0,1000,mult:1000,calc:AVG_RECORD_INTV(3000;Hz),plotheight:0.4
@end   
save=datadir,%YYYY-%MM-%DD.scc,compr,%A_%YYYY.%MM.%DD.%hh:%mm
datatransfer=TempMon_1min


[DataStore] 
use=$ICP7033
id=TempMon_1min
shortname=Temp. data 1-min
desc=1min temperature data
records=64000 
averaging=arithemetic,60,60,4, ${averagelog}
save=sumdir,%YYYY-%MM-1mintemp.dat,ASCII,%A_%YYYY.%MM.%DD.%hh:%mm

# ----------------- MQTT line parsing ----------------
[Sampler] 
use=$mqtt_line
id=MQTT
shortname=MQTT
triggermode=pcclock
comport=stdin
samplingmode=text
timeout_interval=10
sampling_interval=10
comps=P_el_balance, P_el_tot, T_DHW_temp, DHW_power_meas, DHW_power_set, DHW_power_new, DHW_daily_el, DHW_daily_lost, P_boiler
channels=0,1,2,3,4,5,6,7,8
msgformat=%*s GRID: %d tot:%d W | %lf °C | %lf %lf %lf | totals(kWh): %lf %lf | P:%lf
sim=no
nan_strings=?
maxmsglength=140
datatransfer=mqtt_rawdata(P_boiler)

[DataStore] 
use=$mqtt_line
id=mqtt_rawdata
shortname=MQTT rawdata
desc=MQTT raw data
records=64000 
emptydata_interval=0.99    # in seconds, data whole 
averaging=no  
#compn=Name,Unit,precisity,Min,Max[,YAxisStep=1,mult:m,const:c] 
# comp=T_boiler_out,°C,3,-40,100,mult:1
# comp=T_DHW_back,°C,3,-40,100,mult:1
# comp=${Temp3_compname},°C,3,-40,100,mult:1
# comp=T_DHW_diff,°C,3,-40,+100,calc:T_boiler_out-T_DHW_back
comp=P_boiler,bar,1,0,3.0
save=datadir,%YYYY-%MM-%DD.scc,compr,%A_%YYYY.%MM.%DD.%hh:%mm


# ----------------- System moniotor ("status") sampler ----------------
# Status sampler is mainly used to monitor the computer's
# performance and runtime parameters


[Sampler]
use=$sysmon
triggermode=computerclcok
samplingmode=status
id=SysMon
datatransfer=RawSysMon  // "?RawSuppData(CPU_temp)" is not working as there can be more "rawsuppdata"
sampling_interval=5  
skipfirstsamples=2  # skipping the first several samples to jump over the initialization system state
timeout_interval=0.5  
sim=no
# compn= name,type/cmd/file [, cmd_or_file_name,afterthisword, n, delta]
@$sysmon_ext:
  comp=mt_maxdT,	mt_maxdT  # main thread max delta time
  comp=ct_maxdT,	ct_maxdT  # com-port's read thread max delta time
  comp=mt_max_duration, mt_max_duration
  comp=latest_comrxtick,	 latest_comport_buffercontent
  comp=gps_timediff,GPS_TIMEDIFF
  comp=cpuusage, CPUUSAGE  # CPU usage calculated by the program
@end  
@linux:
 comp=CPU_temp_1, cmd:"get-sysmon-param CPU_TEMP-1"
 comp=CPU_temp_2, cmd:"get-sysmon-param CPU_TEMP-2"
 comp=CPU_temp_3, cmd:"get-sysmon-param CPU_TEMP-3" 
 comp=WiFi_signal_quality,  cmd:"get-sysmon-param WIFI-SIGQUAL"
 comp=WiFi_signal_strength, cmd:"get-sysmon-param WIFI-SIGSTRENGTH"
  @$sysmon_ext:
   # comp=cpuusage2,cmd:"ps -o pid,%cpu $pid", find:"$pid"+1 # CPU usage calculated in an other method
   # comp=uptime1,	cmd:uptime,find:"average:"+1
   # comp=utime,    file:/proc/$pid/stat,  find:"(maglin)"+12
   # comp=stime,    file:/proc/$pid/stat,  find:"(maglin)"+13
   comp=uptime,		  cmd:uptime,find:"average:"+3    # System load average for the past 5 minutes
   comp=VmSize,   file:/proc/$pid/status,  find:"VmSize:"+1  # program memory increase
   comp=RxOverrun, cmd:"/bin/sh -c 'sudo cat /proc/tty/driver/serial | grep 2F8'",find:"oe:"+0  # COM1 serial port's Rx overrun
   comp=DatadirSpace, cmd:"/bin/sh -c 'df -k data | tail -1 | cut -c41-50'"
   # comp=ntp_diff, cmd:"/bin/sh -c '/usr/bin/ntpq -p | /bin/sed -n '3p' | /usr/bin/tr -s \   | /usr/bin/cut -d\  -f9'"
   # comp=OpenFiles, cmd:"/bin/sh -c 'lsof | grep -v /lib | grep -v /proc | wc -l'"
   # Note: "list-open-file" (lsof) command can charge system during vnc connection
 @end
@end
@win:
 comp=ProcessMemory0,   ProcessMemory:0
 comp=ProcessMemory1,   ProcessMemory:1  # , fromzero
 comp=ProcessMemory2,   ProcessMemory:2  # , fromzero
 comp=ProcessMemory3,   ProcessMemory:3  # , fromzero
 comp=ProcessMemory4,   ProcessMemory:4  # , fromzero
 comp=ProcessMemory5,   ProcessMemory:5  # , fromzero
@end



[DataStore]
use=$sysmon
id=RawSysmon 
desc=Raw system mon. data
records=1500
# emptydata_interval=11    # in seconds, to detect data wholes 
# filerecord_interval=10 #10
averaging=no     # no/arithmetic/gauss5/gauss1, avg.interval, avg.window
#compn=Name,Unit,precisity,Min,Max[,YAxisStep=1,mult=1,A=0] 
@$sysmon_ext:
 comp=mt_maxdT,tick,1, 0,100000, 1, 1,0
 comp=ct_maxdT,tick,1, 0,1000, 1, 1,0
 comp=mt_max_duration,ms,1, 0,90000, mult:1000
 comp=latest_comrxtick,tick,1,0,100000, 1, 1,0
 comp=cpuusage, %,3, 0,200, 1,  1,0
 comp=gps_timediff, s,3, -1000,1000, 0.001,  1,0
@end
@linux:
  comp=CPU_temp_1,deg.C,1,-10.0,120.0,mult:0.001
  comp=CPU_temp_2,deg.C,1,-10.0,120.0,mult:0.001  
  comp=CPU_temp_3,deg.C,1,-10.0,120.0,mult:0.001    
  comp=WiFi_signal_quality,_,1,0,100
  comp=WiFi_signal_strength,dB,1,-1000,1
  @$sysmon_ext:
   comp=uptime, _,2, 0,1000, 1, 1,0
   comp=VmSize, _,1, -10000,20000000, 1, 1,0
   comp=RxOverrun, _,0, 0,20000000
   comp=DatadirSpace, kb, 0, 0,20000000
   # comp=ntp_diff, msec, 1, -100000,100000
   # comp=OpenFiles, _, 0,0,20000000
   # comp=stime, _,1,0,20000000,1,1
   # comp=cpuusage2, _,1,0,20000000,1,1
  @end
@end
@win:
  comp=ProcessMemory0, kb,1,0,20000000  # , (alert:rangealert_high,0,>34000), (alert:rangealert_low,0,>32000)
  comp=ProcessMemory1, kb,1,0,20000000
  comp=ProcessMemory2, kb,1,0,20000000
  comp=ProcessMemory3, kb,1,0,20000000
  comp=ProcessMemory4, kb,1,0,20000000
  comp=ProcessMemory5, kb,1,0,20000000
@end
save=no
# save=datadir, %YYYY%MM%DD.sysmon-raw.dat,ascii,%hh_%mm_%ss_%ttt_%T_%A  # ,separator:semicolon;  # schedule:test
datatransfer=10minSysMon

[DataStore]
use=$sysmon
id=10minSysMon
desc=10min system mon. data
records=1500
averaging=Arithemtric,600,600,1     # no/arithmetic/gauss5/gauss1, avg.interval, avg.window
save=datadir, %YYYY%MM.sysmon-10min.dat,a,%YYYY_%MM_%DD_%hh_%mm



# ----------------- PalmAcq and Direct GPS sampler ----------------
# DirectGPS is used when a serial or USB GPS is directly connected

[gps]
use=$palmacq_gps
type=N
startupwaittime=900
comport=G,9600,8n1    // ToCheck
$gps_datatransfer_components=Latitude,Longitude,Altitude,Sats-in-view,HDOP   # (PPS_TIMING_ERR,NMEA_TIMING_ERR)
@$accel_gyro_with_palmacqgps: // ToDo: remove when not needed
  $gps_datatransfer_components=Latitude,Longitude,Altitude,Sats-in-view,HDOP,Speed
@end
datatransfer=?gpsrawdata(${gps_datatransfer_components}) 
pps_pulse_length=0.1  # in ms
min_leapsecond=16
fix_mode=auto   # "auto"/"2D"/"3D"/"TimeOnly". Default: "auto". Recommended: "3D" or "auto"
dynamics_code=stationary  # can be: "unchanged", "land","sea", "air", "stationary"
elevation_mask=5     # "-1" for unchanged, 0.0..90 degrees, default: 5 degree
signallevel_mask=2.0  #  0..25, default: 2.0, but can be 6.0-8.0 in good visibility conditions
dop_mask=12.0          #  0.2..100.0, default: 12.0
dop_switch=6.0        #  0.2..100.0, default: 6.0
enhanced_sensitivity=on   # on/off
position_velocity_filter=on
static_filter=on
@!$accel_gyro_with_palmacqgps:
  nmea_output_rate=5  # 1,3,5, 7 or 9 seconds
  configure=no     # if "yes", then the settings are applied and written to GPS flash memory
@else
  nmea_output_rate=1
  configure=yes
  nmea_send_rmc=true
@end
nmea_send_gga=true


# ----------------- GPS datastores ----------------
# Used to display GPS fix data

@$palmacq_gps:
 [DataStore]
 use=$gpsacq
 id=GpsRawData
 desc=Raw GPS data
 records=1500
 emptydata_interval=12    # in seconds, data whole 
 xaxisstep_interval=1  # in second, one pixel equals this time period by default
 filerecord_interval=1
 averaging=no     # no/arithmetic/gauss5/gauss1, avg.interval, avg.window
 #compn=Name,Unit,precisity,Min,Max[,YAxisStep=1,mult=1,A=0] 
 comp=Latitude,deg.,5,-370,370 
 comp=Longitude,deg.,5,-370,370 
 comp=Altitude,m,1,-1000,10000
 comp=Sats-in-view,-,0,0,100
 @$accel_gyro_with_palmacqgps:comp=Speed,kmh,2,-1000,10000
 comp=HDOP,-,3,0,1000
 # comp=TimingErr_pps,ms,1,-10000,10000
 # comp=TimingErr_Nmea,ms,1,-10000,10000
 @!$save_rawgps_data: save=no 
 @$save_rawgps_data: save=datadir,%YYYY%MM%DD.gps.raw.dat,c,%hh:%mm:%ss
 datatransfer=Gps10minData
 @$accel_gyro_with_palmacqgps:datatransfer=AccelGyro_datastore(Latitude:Y,Longitude:X,Altitude:h,Speed:speed)


 [DataStore]
 use=$gpsacq
 id=Gps10minData
 desc=10 min. GPS data
 records=1500
 averaging=arithmetic,600,600,100
 comp=Latitude,deg.,6,-370,370 
 comp=Longitude,deg.,6,-370,370 
 comp=Altitude,m,2,-1000,10000
 comp=Sats-in-view,-,1,0,100
 comp=HDOP,-,3,0,1000
 @!$save_10mingps_data: save=no 
 @$save_10mingps_data: save=datadir,%YYYY%MM.gps.dat,a,%YYYY.%MM.%DD.%hh:%mm
@end


# ----------------- Schedules ----------------

[schedule]
id=sync
@linux: use=no
@win: use=no
run=./aftersaves.sh 
trigger=savecycle
exectimeout=55

[schedule] 
id=send-email
@linux: use=no
@win: use=no
trigger=savefile
@linux:run=./filetransfer.sh email %filename
exectimeout=30

[schedule] 
id=send-ftp
@linux: use=no
@win: use=no
trigger=savefile
@linux:run=./filetransfer.sh ftp %filename
exectimeout=30

[schedule] 
id=backup-copy
@linux: use=no
@win: use=no
trigger=savefile
@linux:run=./filetransfer.sh copy %filename
exectimeout=30

[schedule] 
id=rangealert_low
use=no
trigger=rangecheck 
repeatperiod=2,3
mininterval=4
@linux:run=./rangealert.sh
@win:run=cmd /c rangealert.bat LOW %time %datastore %component %value %limit %direction
exectimeout=10

[schedule] 
id=rangealert_high
use=no
trigger=rangecheck 
repeatperiod=2,3
mininterval=4
@linux:run=./rangealert.sh
@win:run=cmd /c rangealert.bat HIGH %time %datastore %component %value %limit %direction
exectimeout=10


