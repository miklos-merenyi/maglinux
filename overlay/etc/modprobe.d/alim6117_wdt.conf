# maglinux: Vortex86 watchdog (alim6117_wdt), fed by maglinux-watchdogd every 2 s: it
# resets the machine 120 s after Linux (or that service) stops (driver default: 60 s,
# range 1-511). A hung maglin leads to a clean reboot instead: /etc/default/maglinux-watchdog.
options alim6117_wdt timeout=120
