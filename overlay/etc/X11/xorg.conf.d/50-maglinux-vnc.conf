# Share the local X display (:0, LightDM's autologin session) over VNC on port 5901,
# with TigerVNC's Xorg module (tigervnc-xorg-extension): no separate VNC server.
# The VNC password (VncAuth, at most 8 characters) is VNC_PASS in config/settings.sh;
# the build writes it to /etc/X11/vncpasswd (root-only, Xorg runs as root).
# The graphics driver logs 'Option "..." is not used' for these: the VNC module
# reads them, the driver does not.
Section "Module"
    Load "vnc"
EndSection

Section "Screen"
    Identifier "Screen0"
    Option "rfbport" "5901"
    Option "desktop" "maglinux"
    Option "SecurityTypes" "VncAuth"
    Option "PasswordFile" "/etc/X11/vncpasswd"
EndSection
