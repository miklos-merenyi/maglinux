# maglinux: at the end of a shutdown or reboot systemd feeds the hardware watchdog itself
# (after maglinux-watchdogd has stopped): if the shutdown hangs, the machine is reset
# after 2 min. The default, 10 min, is more than the Vortex86 watchdog allows (511 s).
# RuntimeWatchdogSec stays off: during operation maglinux-watchdogd uses the watchdog.
[Manager]
RebootWatchdogSec=2min
