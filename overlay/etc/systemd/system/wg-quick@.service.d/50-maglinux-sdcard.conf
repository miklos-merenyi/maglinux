# maglinux: the interface config comes from the SD card; skip the tunnel quietly
# when the card has no config for it.
[Unit]
Wants=maglinux-wireguard-import.service
After=maglinux-wireguard-import.service
ConditionPathExists=/etc/wireguard/%i.conf
# The peer rejects handshakes whose timestamp is older than the last one it saw
# (replay protection), so wait for NTP (systemd-timesyncd, see
# systemd-time-wait-sync.service.d/) before bringing the tunnel up
Wants=time-sync.target
After=time-sync.target
